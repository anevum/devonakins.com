# Executes only from the repository default branch. The PR's code is never
# checked out or executed. Do not require this job until it is bootstrapped on
# main, verified, and the public-repo event policy explicitly permits it.
name: AIEI trusted review
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
  pull-requests: read
jobs:
  trusted-review-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate PR against GitHub API using base-branch code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/aiei-trusted-review.mjs
