name: Deploy DevonAkins.com (manual)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested 40-character main commit to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: devonakins-com-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard exact commit and Worker name
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -eu
          case "$EXPECTED_SHA" in
            *[!a-f0-9]*|'') echo 'Expected a lowercase hexadecimal commit SHA'; exit 1 ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq '"name": "devonakins-personal"' wrangler.jsonc
      - name: Build and validate Worker
        run: |
          npm ci
          npm run build
          npm test
          node --check scripts/verify-live.mjs
      - name: Require dedicated Cloudflare CI credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Deploy only devonakins-personal Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 deploy
      - name: Verify actual public deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-live.mjs
